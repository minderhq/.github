<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Minder — your private AI platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- subtle knowledge-graph motif (right) -->
  <g stroke="#c7d2fe" stroke-width="2" opacity="0.35">
    <line x1="915" y1="95" x2="1015" y2="60"/>
    <line x1="1015" y1="60" x2="1105" y2="120"/>
    <line x1="1105" y1="120" x2="1035" y2="205"/>
    <line x1="1035" y1="205" x2="930" y2="215"/>
    <line x1="930" y1="215" x2="915" y2="95"/>
    <line x1="915" y1="95" x2="1035" y2="205"/>
    <line x1="1015" y1="60" x2="1035" y2="205"/>
  </g>
  <g fill="#e0e7ff">
    <circle cx="915" cy="95" r="11" opacity="0.9"/>
    <circle cx="1015" cy="60" r="14" opacity="1"/>
    <circle cx="1105" cy="120" r="9" opacity="0.8"/>
    <circle cx="1035" cy="205" r="12" opacity="0.95"/>
    <circle cx="930" cy="215" r="8" opacity="0.75"/>
  </g>

  <!-- wordmark (typography inlined as presentation attributes so it renders even if <style> is sanitized) -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="92" letter-spacing="1" fill="#ffffff">Minder</text>
  <text x="84" y="200" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="30" fill="#c7d2fe">Your private AI platform.</text>
  <text x="84" y="242" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="3" fill="#a5b4fc">LOCAL-FIRST · SELF-HOSTED · OPEN ECOSYSTEM</text>
</svg>
