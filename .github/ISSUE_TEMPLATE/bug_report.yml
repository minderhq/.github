name: Bug report
description: Something isn't working as expected
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** include
        secrets, tokens, or private data in logs or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps — a minimal reproduction helps a lot.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Affected repo / version / commit
      placeholder: "e.g. client @ v0.3.1, or a commit sha"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker/runtime versions, self-host setup, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant output. Do NOT include secrets.
      render: shell
    validations:
      required: false
