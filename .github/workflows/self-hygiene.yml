name: Public hygiene (self)

# Runs this repo's own reusable hygiene workflow against itself, so a change to
# the scanner is exercised on its own PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: ./.github/workflows/public-hygiene.yml
